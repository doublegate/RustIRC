name: Release

# Single packaging/publication implementation: Master Pipeline on an existing tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed stable version tag (e.g., v0.4.3)'
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  dispatch-release:
    name: Dispatch guarded tag release
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag and dispatch Master Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --silent
          gh workflow run master-pipeline.yml --ref "$RELEASE_TAG"
          echo "Master Pipeline dispatched for $RELEASE_TAG; follow its checks and release result."
